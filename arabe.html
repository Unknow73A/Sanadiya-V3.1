 {id:"l4",fr:"Avec les voyelles",bs:"S vokalima",sf:"Fatha, kasra, damma, soukoûn",sb:"Fetha, kesra, damma, sukun",mode:"trace",items:function(){var a=[];L.forEach(function(x,i){if(i===0)return;var v=EVW[i%4];var vf=["a","i","ou",""][i%4],vb=["a","i","u",""][i%4];a.push({t:x[0]+v[0],fr:"Écris "+x[1]+" avec "+v[1],bs:"Napiši "+x[2]+" sa "+v[2],k:x[0]+v[0],ph:{f:"« "+TRF[i]+vf+" »"+(vf?"":" (sans voyelle)"),b:"»"+TRB[i]+vb+"«"+(vb?"":" (bez vokala)")}});});return a;}},
 {id:"l5",fr:"Lettres liées",bs:"Spojena slova",sf:"Petits mots",sb:"Kratke riječi",mode:"trace",items:function(){return WORDS.map(function(w){return {t:w[0],fr:"Écris le mot « "+w[1]+" »",bs:"Napiši riječ »"+w[2]+"«",k:w[0],ph:{f:w[1],b:w[2]}};});}},

 {id:"l7",fr:"Dictée",bs:"Diktat",sf:"Lire la phonétique, puis écrire",sb:"Pročitaj fonetiku, pa napiši",mode:"mem",items:function(){return WORDS.map(function(w){return {t:w[0],fr:"Écris sans modèle : « "+w[1]+" »",bs:"Napiši bez uzora: »"+w[2]+"«",k:w[0],hide:1,ph:{f:w[1],b:w[2]}};}).concat(DAILY.slice(0,6).map(function(w){return {t:w[0],fr:"Écris sans modèle : « "+w[1]+" »",bs:"Napiši bez uzora: »"+w[1]+"«",k:w[0],hide:1,ph:{f:w[1],b:w[1]}};}));}},
 {id:"l8",fr:"Phrases des cours de l’imam",bs:"Rečenice iz imamovih lekcija",sf:"Croyance, purification, prière, jeûne",sb:"Vjerovanje, čistoća, namaz, post",mode:"trace",phr:1,items:function(){var a=[];PHR.forEach(function(p,pi){var parts=p[0].split("|"),full=parts.join(" ");parts.forEach(function(s,k){a.push({t:s,p:pi,ph:{f:p[1],b:p[1]},fr:"Partie "+(k+1)+" / "+parts.length+(parts.length>1?"":""),bs:"Dio "+(k+1)+" / "+parts.length,k:s});});if(parts.length>1&&full.split(" ").length<=6)a.push({t:full,p:pi,ph:{f:p[1],b:p[1]},fr:"La phrase entière",bs:"Cijela rečenica",k:full,full:1});});return a;}}];
var LVC={};function lvItems(li){if(!LVC[li])LVC[li]=LEVELS[li].items();return LVC[li];}
function exLoad(){try{return JSON.parse(localStorage.getItem("ar-ex")||"{}");}catch(e){return {};}}
function exSave(o){try{localStorage.setItem("ar-ex",JSON.stringify(o));}catch(e){}}
function exBest(li,k){var o=exLoad(),m=o[LEVELS[li].id]||{};return m[k];}
function stars(sc){return sc===undefined?0:sc>=90?3:sc>=75?2:sc>=60?1:0;}
function stS(n,max){max=max||3;var s="";for(var i=0;i<max;i++)s+=i<n?"⭐":"☆";return s;}
function lvStat(li){var it=lvItems(li),o=exLoad()[LEVELS[li].id]||{},done=0,sum=0,st=0;it.forEach(function(x){var b=o[x.k];if(b!==undefined&&b>=60)done++;sum+=b||0;st+=stars(b);});var avg=Math.round(sum/it.length);return {n:it.length,done:done,avg:avg,stars:st,pass:done===it.length&&avg>=75,lvl:done===it.length?(avg>=90?3:avg>=75?2:1):0};}
function lvOpen(li){return li===0||lvStat(li-1).pass;}
function exDays(){try{return JSON.parse(localStorage.getItem("ar-exd")||"[]");}catch(e){return [];}}
function today(d){d=d||new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}
function markDay(){var a=exDays(),t=today();if(a.indexOf(t)<0){a.push(t);if(a.length>400)a=a.slice(-400);try{localStorage.setItem("ar-exd",JSON.stringify(a));}catch(e){}}}
function streak(){var a=exDays(),n=0,d=new Date();if(a.indexOf(today(d))<0)d.setDate(d.getDate()-1);while(a.indexOf(today(d))>=0){n++;d.setDate(d.getDate()-1);}return n;}
function exNote(){return "<p class='note'>"+T("Note : estimation automatique de la forme, de la taille, des proportions, des points et du sens d’écriture ; l’ordre exact des traits n’est pas vérifié. Fais confirmer par ton professeur ou l’imam. Mots, phrases et traductions : à faire vérifier par l’imam.","Ocjena: automatska procjena oblika, veličine, proporcija, tačaka i smjera pisanja; tačan redoslijed poteza se ne provjerava. Neka potvrdi učitelj ili imam. Riječi, rečenice i prijevodi: treba provjeriti imam.")+"</p>";}
R.ex=function(){EX=null;var tot=0,done=0,st=0,curL=-1;LEVELS.forEach(function(l,i){var s=lvStat(i);tot+=s.n;done+=s.done;st+=s.stars;if(curL<0&&!s.pass)curL=i;});var pc=Math.round(100*done/tot),sk=streak();
 var h="<div class='card exsum'><div class='ring' style='background:conic-gradient(var(--ac) 0 "+pc+"%,var(--line) "+pc+"% 100%)'><i>"+pc+" %</i></div><div><b>"+T("Ton parcours d’écriture","Tvoj put pisanja")+"</b><br><small class='note'>"+(curL>=0?T("Niveau "+(curL+1)+" en cours","Nivo "+(curL+1)+" u toku"):T("Tous les niveaux réussis, mâ shâ’ Allah !","Svi nivoi završeni, mašallah!"))+" · "+st+" ⭐"+(sk?" · "+sk+" "+T(sk>1?"jours d’affilée":"jour","dan(a) zaredom")+" 🔥":"")+"</small></div></div>";
 LEVELS.forEach(function(l,i){var s=lvStat(i),op=lvOpen(i),cls=s.pass?"done":(op?(i===curL?"cur":""):"lock");
  h+="<button class='exlv "+cls+"' data-exl='"+i+"'"+(op?"":" disabled")+"><span class='n'>"+(s.pass?"✓":op?(i+1):"🔒")+"</span><span class='tx'><b>"+(i+1)+". "+T(l.fr,l.bs)+"</b><small>"+T(l.sf,l.sb)+" · "+s.done+" / "+s.n+"</small>"+(op&&!s.pass?"<span class='bar'><i style='width:"+Math.round(100*s.done/s.n)+"%'></i></span>":"")+"</span><span class='st'>"+(s.lvl?stS(s.lvl):"")+"</span></button>";});
 h+="<p class='note'>"+T("Pour débloquer le niveau suivant : au moins ⭐ sur chaque exercice et une moyenne de 75 %. ⭐ = 60 %, ⭐⭐ = 75 %, ⭐⭐⭐ = 90 %. La progression reste sur ton appareil.","Za otključavanje sljedećeg nivoa: barem ⭐ na svakoj vježbi i prosjek 75 %. ⭐ = 60 %, ⭐⭐ = 75 %, ⭐⭐⭐ = 90 %. Napredak ostaje na tvom uređaju.")+"</p>"+exNote();
 M.innerHTML=h;};
R.exlv=function(li,fin){EX=null;cur="ex";nav();var l=LEVELS[li],it=lvItems(li),o=exLoad()[l.id]||{},s=lvStat(li),wasPass=fin&&fin.before===false&&s.pass;
 var h="<button data-m='ex'>← "+T("Parcours","Put")+"</button>";
 if(fin)h+="<div class='card' style='text-align:center'><div style='font-size:30px'>"+stS(Math.max(0,Math.min(3,Math.round(fin.avg>=90?3:fin.avg>=75?2:fin.avg>=60?1:0))))+"</div><b>"+T("Série terminée","Serija završena")+" · "+fin.avg+" %</b>"+(wasPass?"<p><b>"+T("Niveau "+(li+1)+" réussi, mâ shâ’ Allah ! 🏅","Nivo "+(li+1)+" završen, mašallah! 🏅")+"</b>"+(li<7?"<br>🔓 "+T("Niveau "+(li+2)+" débloqué","Nivo "+(li+2)+" otključan"):"")+"</p>":"")+"</div>";
 h+="<div class='card'><b>"+(li+1)+". "+T(l.fr,l.bs)+"</b><p class='note'>"+T(l.sf,l.sb)+" · "+s.done+" / "+s.n+" · "+T("moyenne","prosjek")+" "+s.avg+" %"+(s.pass?" · ✓ "+T("réussi","završeno"):"")+"</p>";
 if(l.phr){h+=PHR.map(function(p,pi){var ks=it.filter(function(x){return x.p===pi;}),sc=ks.map(function(x){return o[x.k];}),dn=sc.every(function(v){return v!==undefined;}),av=dn?Math.round(sc.reduce(function(a,b){return a+b;},0)/sc.length):undefined;
   return "<div class='exph'><span class='ar'>"+p[0].split("|").join(" ")+"</span><small>"+T(p[4],p[5])+(p[6]?" · "+T("à rattacher au cours de l’imam sur la prière","treba povezati s imamovom lekcijom o namazu"):"")+"</small><span class='st'>"+(av!==undefined?stS(stars(av)):"")+"</span></div>";}).join("");}
 else h+="<div class='exgrid'>"+it.map(function(x){var b=o[x.k];return "<div class='"+(b!==undefined&&b<60?"w":"")+"'><span class='ar'>"+x.t+"</span><small>"+(b===undefined?"·":stS(stars(b)).replace(/☆/g,""))+"</small></div>";}).join("")+"</div>";
 var weak=it.filter(function(x){var b=o[x.k];return b!==undefined&&b<75;});
 if(weak.length)h+="<p class='note'>"+T("À retravailler (reviennent en premier dans les séries) : ","Za ponoviti (dolaze prvi u serijama): ")+"<span class='ar' style='font-size:22px'>"+weak.slice(0,8).map(function(x){return x.t;}).join(" ، ")+"</span></p>";
 h+="<div class='row'><button class='pri' data-exs='"+li+"'>"+(s.done?T("Continuer une série","Nastavi seriju"):T("Commencer","Počni"))+"</button>"+(s.pass&&li<7?"<button data-exl='"+(li+1)+"'>"+T("Niveau "+(li+2)+" →","Nivo "+(li+2)+" →")+"</button>":"")+"</div></div>"+exNote();
 M.innerHTML=h;window.scrollTo(0,0);};
function exStart(li){var it=lvItems(li),o=exLoad()[LEVELS[li].id]||{},idx=it.map(function(x,i){return i;});
 function key(i){var b=o[it[i].k];return b===undefined?[1,i]:b<60?[0,b]:b<75?[0.5,b]:[2,b+Math.random()*5];}
 idx.sort(function(a,b){var A=key(a),B=key(b);return A[0]-B[0]||A[1]-B[1];});
 if(LEVELS[li].phr){var ps=[],out=[];idx.forEach(function(i){var q=it[i].p;if(ps.indexOf(q)<0&&out.length<5){ps.push(q);it.forEach(function(x,j){if(x.p===q)out.push(j);});}});idx=out;}
 else idx=idx.slice(0,7);
 EX={li:li,lv:LEVELS[li],q:idx,k:0,tries:0,sc:[],before:lvStat(li).pass};exGo();}
function exGo(){EX.it=lvItems(EX.li)[EX.q[EX.k]];EX.tries=0;EX.best=undefined;wmode=EX.lv.mode;cur="ex";nav();R.write();window.scrollTo(0,0);}
function exHead(){var it=EX.it,l=EX.lv,h="<div class='exhd'><div class='row' style='justify-content:space-between;margin:0'><span>"+T("Niveau","Nivo")+" "+(EX.li+1)+" · "+(EX.k+1)+" / "+EX.q.length+"</span><button data-exq='1' class='snd'>✕ "+T("Quitter","Izađi")+"</button></div><div class='prog'>"+EX.q.map(function(x,i){return "<i class='"+(i<EX.k?"ok":i===EX.k?"cu":"")+"'></i>";}).join("")+"</div>";
 if(l.phr){var p=PHR[it.p];h+="<div class='card' style='margin:6px 0;text-align:center'><span class='ar' style='font-size:24px;display:block'>"+p[0].split("|").map(function(s){return s===it.t||it.full?"<mark>"+s+"</mark>":s;}).join(" ")+"</span><small class='note'>"+p[1]+"<br>« "+T(p[2],p[3])+" »</small><br><small class='note'>"+T(p[4],p[5])+"</small></div><b>"+T(it.fr,it.bs)+"</b>";}
 else h+="<b>"+T(it.fr,it.bs)+"</b>"+(it.hide?"":" <span class='ar' style='font-size:26px'>"+it.t+"</span>");
 h+=" <small class='note'>· "+(l.mode==="mem"?T("sans modèle","bez uzora"):T("calquer","precrtaj"))+" · "+T(TRIES+" essais",TRIES+" pokušaja")+"</small></div>";return h;}
function exScore(sc){var o=exLoad(),id=EX.lv.id;o[id]=o[id]||{};var k=EX.it.k;o[id][k]=Math.max(o[id][k]||0,sc);exSave(o);markDay();EX.tries++;lockPad(true);EX.best=Math.max(EX.best||0,sc);
 var r=document.getElementById("exr");if(!r)return;var n=stars(EX.best),last=EX.k>=EX.q.length-1;
 r.innerHTML="<div class='exres "+(sc>=60?"ok":"ko")+"'><b>"+sc+" %</b> · "+stS(stars(sc))+" · "+T("essai","pokušaj")+" "+EX.tries+" / "+TRIES+(EX.tries>1?" · "+T("meilleur","najbolje")+" "+EX.best+" %":"")+"</div><div class='row'>"+(EX.tries<TRIES?"<button data-exr='1'>"+T("✍ Essai suivant ("+(EX.tries+1)+" / "+TRIES+")","✍ Sljedeći pokušaj ("+(EX.tries+1)+" / "+TRIES+")")+"</button>":"<span class='note'>"+T("Les "+TRIES+" essais sont faits.","Svih "+TRIES+" pokušaja je iskorišteno.")+"</span>")+"<button class='pri' data-exn='1'"+(EX.tries<TRIES?" disabled title='"+T("Disponible après les "+TRIES+" essais","Dostupno nakon "+TRIES+" pokušaja")+"'":"")+">"+(last?T("Voir le bilan","Pogledaj rezultat"):T("Suivant →","Dalje →"))+(EX.tries<TRIES?" 🔒":"")+"</button></div>"+(EX.tries<TRIES?"<p class='note'>"+T("« Suivant » s’ouvre après les "+TRIES+" essais.","»Dalje« se otvara nakon "+TRIES+" pokušaja.")+"</p>":"");}
function exNext(){EX.sc.push(EX.best||0);if(EX.k<EX.q.length-1){EX.k++;exGo();return;}var li=EX.li,avg=Math.round(EX.sc.reduce(function(a,b){return a+b;},0)/EX.sc.length),bf=EX.before;EX=null;R.exlv(li,{avg:avg,before:bf});}

}
